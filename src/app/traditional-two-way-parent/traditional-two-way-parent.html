<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            parent component
        </div>

        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">
                    Parent Quantity
                </label>

                <input type="number" class="form-control" [(ngModel)]="parentQuantity" />
            </div>

            <button class="btn btn-secondary mb-3" (click)="resetQuantity()">
                Reset Parent Quantity
            </button>

            <!-- <app-traditional-two-way-child [childQuantity]="parentQuantity" 
                (childQuantityChange)="parentQuantity = $event">
            </app-traditional-two-way-child> -->

            <app-traditional-two-way-child [(childQuantity)]="parentQuantity" >
            </app-traditional-two-way-child>

            <div class="alert alert-info mt-4 mb-0">
                <strong>Parent Quantity:</strong>
                {{ parentQuantity }}
            </div>
        </div>
    </div>
</div>
