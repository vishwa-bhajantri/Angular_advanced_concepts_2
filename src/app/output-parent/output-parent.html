<div class="container mt-5">
    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <i class="bi bi-phone me-2"></i>
            parent Component Message Reciever
        </div>
        
        <div class="card-body">

            <div class="m-4">
            <app-output-child
            (traditionalMessage)="recievingTraditionalOutput($event)"
            (modernMessageText)="recievingModernOutput($event)"
            >

            </app-output-child>
            </div>

            <!-- Child Component -->
            <div class="col-md-6 mb-3">
                <div class="card border-primary h-100">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-phone-vibrate me-2"></i>
                        Parent Phone @Output()
                    </div>
                    
                    <div class="card-body">
                        <p class="text-muted">
                            Message Recieved from Child
                        </p>
                        <div class="alert alert-primary mb-0">
                            <i class="bi bi-chat-left-text me-2"></i>
                            {{recieveTraditionalMessage}}
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
